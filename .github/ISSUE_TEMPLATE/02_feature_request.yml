name: Feature Request
description: Suggest an idea for attack-shark-linux
title: "feature: "
labels: [enhancement, "status:pending-approval"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! For larger changes, please consider starting a [Discussion](https://github.com/blak0p/attack-shark-linux/discussions) first.
        
        **Note:** This project is currently focused on the Attack Shark X6. Features for other Attack Shark models can be suggested here, but we encourage discussing device support separately in a [Device Support issue](https://github.com/blak0p/attack-shark-linux/issues/new?template=03_device_support.yml).

  - type: dropdown
    id: device_scope
    attributes:
      label: Device scope
      description: Is this feature for the currently supported X6, or for another Attack Shark model?
      options:
        - "Attack Shark X6 (currently supported)"
        - "Other Attack Shark model"
        - "Not device-specific / General improvement"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? What are you trying to do?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact — why do you want this?
      description: Describe the current pain, how often it occurs, and the cost of not having this feature.
      placeholder: "This happens every time I..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What do you think should happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions
      description: What alternatives have you considered?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false

  - type: checkboxes
    id: search
    attributes:
      label: Search
      options:
        - label: |
            I searched for existing open and closed issues before opening this
          required: true
