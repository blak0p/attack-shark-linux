name: Security Setup

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create issue labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          declare -a LABELS=(
            "status:pending-approval:#d9534f:Awaiting maintainer approval"
            "status:approved:#0e8a16:Approved for implementation"
            "bug:#d73a4a:Something isn't working"
            "enhancement:#a2eeef:New feature or request"
            "good first issue:#7057ff:Good for newcomers"
            "help wanted:#008672:Extra attention is needed"
            "security:#b60205:Security related"
            "planned:#1d76db:Planned work"
            "never-stale:#ffffff:Exempt from the stale bot"
          )
          for ENTRY in "${LABELS[@]}"; do
            IFS=':' read -r NAME COLOR DESC <<< "$ENTRY"
            gh label create "$NAME" --color "$COLOR" --description "$DESC" --force || true
          done

      - name: Configure branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT /repos/blak0p/attack-shark-linux/branches/main/protection \
            -H "Accept: application/vnd.github+json" \
            -f required_status_checks='{"strict":true,"contexts":["go","frontend"]}' \
            -f enforce_admins=true \
            -f required_pull_request_reviews='{"required_approving_review_count":1,"dismiss_stale_reviews":true,"require_code_owner_reviews":true}' \
            -f restrictions=null \
            -f allow_force_pushes=false \
            -f allow_deletions=false \
            -f required_conversation_resolution=true

      - name: Configure repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit blak0p/attack-shark-linux \
            --delete-branch-on-merge \
            --enable-squash-merge \
            --enable-rebase-merge \
            --enable-merge-commit