name: Security Setup

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create issue labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "status:pending-approval" --color "d9534f" --description "Awaiting maintainer approval" --force || true
          gh label create "status:approved" --color "0e8a16" --description "Approved for implementation" --force || true
          gh label create "bug" --color "d73a4a" --description "Something isn't working" --force || true
          gh label create "enhancement" --color "a2eeef" --description "New feature or request" --force || true
          gh label create "good first issue" --color "7057ff" --description "Good for newcomers" --force || true
          gh label create "help wanted" --color "008672" --description "Extra attention is needed" --force || true
          gh label create "security" --color "b60205" --description "Security related" --force || true
          gh label create "planned" --color "1d76db" --description "Planned work" --force || true
          gh label create "never-stale" --color "ffffff" --description "Exempt from the stale bot" --force || true

      - name: Configure branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/br-protection.json << 'EOF'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["go", "frontend"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }
          EOF
          gh api --method PUT /repos/blak0p/attack-shark-linux/branches/main/protection \
            -H "Accept: application/vnd.github+json" \
            --input /tmp/br-protection.json

      - name: Configure repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit blak0p/attack-shark-linux \
            --delete-branch-on-merge \
            --enable-squash-merge \
            --enable-rebase-merge \
            --enable-merge-commit