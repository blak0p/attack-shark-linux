name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Pushed tag '$TAG' must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi

          object_type="$(git for-each-ref --format='%(objecttype)' "refs/tags/$TAG")"
          if [[ "$object_type" != "tag" ]]; then
            echo "::error::Pushed tag '$TAG' is lightweight; an annotated tag is required."
            exit 1
          fi

          release_notes="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")"
          if [[ -z "${release_notes//[[:space:]]/}" ]]; then
            echo "::error::Annotated tag '$TAG' has an empty message."
            exit 1
          fi

          printf '%s\n' "$release_notes" > "$RUNNER_TEMP/release-notes.md"

      - name: Run verification
        run: make check

      - name: Package signed release artifacts
        working-directory: cmd/x6configurator
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/attack-shark-linux-x86_64.AppImage
          ATTACK_SHARK_RELEASE_SIGNING_SEED: ${{ secrets.ATTACK_SHARK_RELEASE_SIGNING_SEED }}
        run: task package:container:release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_args=(
            --verify-tag
            --title "$TAG"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$TAG" =~ -rc\. ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh release create "$TAG" "${release_args[@]}" \
            cmd/x6configurator/build/release/attack-shark-linux-x86_64.AppImage \
            cmd/x6configurator/build/release/attack-shark-linux-x86_64.AppImage.sha256 \
            cmd/x6configurator/build/release/update-manifest.json \
            packaging/udev/60-attack-shark-x6-hidraw.rules
