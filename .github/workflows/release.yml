name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and package release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Pushed tag '$TAG' must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi

          object_type="$(git for-each-ref --format='%(objecttype)' "refs/tags/$TAG")"
          if [[ "$object_type" != "tag" ]]; then
            echo "::error::Pushed tag '$TAG' is lightweight; an annotated tag is required."
            exit 1
          fi

          release_notes="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")"
          if [[ -z "${release_notes//[[:space:]]/}" ]]; then
            echo "::error::Annotated tag '$TAG' has an empty message."
            exit 1
          fi

          mkdir -p build-meta
          printf '%s\n' "$release_notes" > build-meta/release-notes.md

      - name: Run verification
        run: make check

      - name: Package signed release artifacts
        working-directory: cmd/x6configurator
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/attack-shark-linux-x86_64.AppImage
          ATTACK_SHARK_RELEASE_SIGNING_SEED: ${{ secrets.ATTACK_SHARK_RELEASE_SIGNING_SEED }}
        run: |
          set -euo pipefail
          mkdir -p build/release
          release_public_key="$(go run ../../cmd/release public-key)"
          sed "s|__ATTACK_SHARK_RELEASE_PUBLIC_KEY__|$release_public_key|" ../../install.sh > build/release/install.sh
          chmod 0755 build/release/install.sh
          task package:container:release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            cmd/x6configurator/build/release/
            build-meta/release-notes.md
          retention-days: 1

  smoke-test-distros:
    name: Smoke test (${{ matrix.distro.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            install: |
              apt-get update
              apt-get install -y --no-install-recommends xvfb libgtk-4-1 libegl1 libgles2
          - name: Arch Linux
            image: archlinux:latest
            install: |
              pacman -Sy --noconfirm archlinux-keyring
              pacman -S --noconfirm --needed xorg-server-xvfb gtk4
          - name: Fedora
            image: fedora:latest
            install: |
              dnf install -y xorg-x11-server-Xvfb gtk4 libGLES
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Run ${{ matrix.distro.name }} smoke test
        run: |
          set -euo pipefail
          chmod +x cmd/x6configurator/build/release/attack-shark-linux-x86_64.AppImage
          chmod +x packaging/appimage/smoke-test.sh

          docker run --rm \
            -v "$PWD/cmd/x6configurator/build/release:/artifacts:ro" \
            -v "$PWD/packaging/appimage:/scripts:ro" \
            "${{ matrix.distro.image }}" \
            sh -c '
              set -eu
              echo "==> Installing minimal dependencies on ${{ matrix.distro.name }}..."
              ${{ matrix.distro.install }}
              /scripts/smoke-test.sh /artifacts/attack-shark-linux-x86_64.AppImage
            '

  browser-e2e:
    name: Browser tests (playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Chromium and system dependencies
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run browser tests
        run: cd frontend && npm run e2e

  release:
    name: Publish GitHub Release
    needs: [build, smoke-test-distros, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_args=(
            --verify-tag
            --title "$TAG"
            --notes-file build-meta/release-notes.md
          )
          if [[ "$TAG" =~ -rc\. ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh release create "$TAG" "${release_args[@]}" \
            cmd/x6configurator/build/release/attack-shark-linux-x86_64.AppImage \
            cmd/x6configurator/build/release/attack-shark-linux-x86_64.AppImage.sha256 \
            cmd/x6configurator/build/release/update-manifest.json \
            cmd/x6configurator/build/release/install.sh \
            packaging/udev/60-attack-shark-x6-hidraw.rules
