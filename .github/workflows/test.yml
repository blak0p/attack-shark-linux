name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build, vet & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build frontend assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  aur:
    name: AUR packages (clean Arch build, install, remove)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # actions/checkout needs git inside the container to keep the .git
      # directory, which the -git package builds from.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, lint, install and remove both AUR packages
        run: bash packaging/aur/check.sh
        env:
          SRC: ${{ github.workspace }}

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

  browser-e2e:
    name: Browser tests (playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Chromium and system dependencies
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run browser tests
        run: cd frontend && npm run e2e