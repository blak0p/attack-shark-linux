version: '3'

tasks:
  bindings:
    desc: Generate canonical Wails TypeScript bindings and mirror the complete tree for the desktop frontend.
    dir: .
    cmds:
      - wails3 generate bindings -ts -d ../../frontend/bindings
      - rsync -a --delete ../../frontend/bindings/ frontend/bindings/

  build:
    desc: Build the Wails desktop application without re-entering Wails.
    deps: [build:frontend]
    cmds:
      - go build -o ../../bin/attack-shark-linux .

  build:frontend:
    desc: Build the embedded frontend assets.
    dir: ../../frontend
    cmds:
      - npm run build

  prepare:appdir:
    desc: Configure WebKit permissions, AppRun hooks, and AppRun wrapper for portable execution.
    cmds:
      - ../../packaging/appimage/prepare-appdir.sh build/appimage/attack-shark-linux-x86_64.AppDir

  package:
    desc: Package a Linux AppImage from freshly built frontend assets.
    deps: [build:frontend]
    cmds:
      - go build -o build/attack-shark-linux .
      - |-
        PKG_CONFIG_PATH="/usr/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" wails3 generate appimage -binary build/attack-shark-linux -icon ../../packaging/icons/attack-shark-x6.svg -desktopfile ../../packaging/desktop/attack-shark-x6.desktop -outputdir build -builddir build/appimage &&
        task prepare:appdir &&
        (cd build && APPIMAGE_EXTRACT_AND_RUN=1 appimage/linuxdeploy-x86_64.AppImage --appdir appimage/attack-shark-linux-x86_64.AppDir --output appimage)

  package:release:
    desc: Build and stage signed release artifacts from a normalized release tag.
    deps: [build:frontend]
    cmds:
      - test -n "$RELEASE_TAG" && test -n "$RELEASE_URL" && test -n "$ATTACK_SHARK_RELEASE_SIGNING_SEED"
      - |-
        release_public_key="$(go run ../../cmd/release public-key)" &&
        go build -ldflags "-X github.com/blak0p/attack-shark-linux/internal/update.CurrentVersion=${RELEASE_TAG#v} -X github.com/blak0p/attack-shark-linux/internal/update.ReleasePublicKey=${release_public_key}" -o build/attack-shark-linux . &&
        PKG_CONFIG_PATH="/usr/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" wails3 generate appimage -binary build/attack-shark-linux -icon ../../packaging/icons/attack-shark-x6.svg -desktopfile ../../packaging/desktop/attack-shark-x6.desktop -outputdir build -builddir build/appimage &&
        task prepare:appdir &&
        (cd build && APPIMAGE_EXTRACT_AND_RUN=1 appimage/linuxdeploy-x86_64.AppImage --appdir appimage/attack-shark-linux-x86_64.AppDir --output appimage) &&
        ATTACK_SHARK_RELEASE_SIGNING_SEED="$ATTACK_SHARK_RELEASE_SIGNING_SEED" go run ../../cmd/release stage -tag "$RELEASE_TAG" -appimage build/attack-shark-linux-x86_64.AppImage -output-dir build/release -url "$RELEASE_URL"

  package:container:
    desc: Package the Linux AppImage in a rootless Ubuntu 24.04 Podman builder.
    cmds:
      - podman build --tag attack-shark-x6-appimage-builder:ubuntu-24.04 --file ../../packaging/appimage/Containerfile ../../packaging/appimage
      - podman run --rm --userns=keep-id --user "$(id -u):$(id -g)" --env HOME=/tmp --env APPIMAGE_EXTRACT_AND_RUN=1 --volume ../..:/workspace:Z --workdir /workspace/cmd/x6configurator attack-shark-x6-appimage-builder:ubuntu-24.04 task package

  package:container:release:
    desc: Build and stage signed release artifacts in the rootless Ubuntu 24.04 builder.
    cmds:
      - test -n "$RELEASE_TAG" && test -n "$RELEASE_URL" && test -n "$ATTACK_SHARK_RELEASE_SIGNING_SEED"
      - podman build --tag attack-shark-x6-appimage-builder:ubuntu-24.04 --file ../../packaging/appimage/Containerfile ../../packaging/appimage
      - podman run --rm --userns=keep-id --user "$(id -u):$(id -g)" --env HOME=/tmp --env APPIMAGE_EXTRACT_AND_RUN=1 --env RELEASE_TAG --env RELEASE_URL --env ATTACK_SHARK_RELEASE_SIGNING_SEED --volume ../..:/workspace:Z --workdir /workspace/cmd/x6configurator attack-shark-x6-appimage-builder:ubuntu-24.04 sh -c 'npm --prefix ../../frontend run build && release_public_key="$(go run ../../cmd/release public-key)" && go build -ldflags "-X github.com/blak0p/attack-shark-linux/internal/update.CurrentVersion=${RELEASE_TAG#v} -X github.com/blak0p/attack-shark-linux/internal/update.ReleasePublicKey=${release_public_key}" -o build/attack-shark-linux . && wails3 generate appimage -binary build/attack-shark-linux -icon ../../packaging/icons/attack-shark-x6.svg -desktopfile ../../packaging/desktop/attack-shark-x6.desktop -outputdir build -builddir build/appimage && task prepare:appdir && (cd build && appimage/linuxdeploy-x86_64.AppImage --appdir appimage/attack-shark-linux-x86_64.AppDir --output appimage) && go run ../../cmd/release stage -tag "$RELEASE_TAG" -appimage build/attack-shark-linux-x86_64.AppImage -output-dir build/release -url "$RELEASE_URL"'
