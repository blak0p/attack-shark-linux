version: '3'

vars:
  WAILS_VERSION: v3.0.0-beta.5
  WAILS_COMMAND: go run github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}

tasks:
  linux:prerequisites:
    summary: Lists the GTK/WebKit development packages required for legacy GTK3 builds.
    cmds:
      - 'printf "%s\n" "Debian/Ubuntu: sudo apt install libgtk-3-dev libwebkit2gtk-4.1-dev"'
      - 'printf "%s\n" "Fedora: sudo dnf install gtk3-devel webkit2gtk4.1-devel"'
      - 'printf "%s\n" "Arch: sudo pacman -S gtk3 webkit2gtk-4.1"'

  build:
    summary: Builds the future desktop application with the legacy GTK3 backend.
    cmds:
      - '{{.WAILS_COMMAND}} build -config ./config.yml -tags gtk3'
